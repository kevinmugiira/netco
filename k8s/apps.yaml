apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: netco
  labels: {app: inventory-service}
spec:
  ports: [{name: http, port: 8083, targetPort: 8083}]
  selector: {app: inventory-service}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: netco
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-service}}
  template:
    metadata:
      labels: {app: inventory-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8083"}
    spec:
      containers:
        - name: inventory-service
          image: netco/inventory-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8083}]
          envFrom: [{configMapRef: {name: netco-config}}]
          env:
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: netco-secrets, key: SPRING_DATASOURCE_PASSWORD}}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8083}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
