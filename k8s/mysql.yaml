apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: netco
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: netco
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: Netco_microservices
            - name: MYSQL_USER
              valueFrom: {configMapKeyRef: {name: netco-config, key: SPRING_DATASOURCE_USERNAME}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: netco-secrets, key: SPRING_DATASOURCE_PASSWORD}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: netco-secrets, key: MYSQL_ROOT_PASSWORD}}
          volumeMounts:
            - {name: mysql-data, mountPath: /var/lib/mysql}
          readinessProbe:
            exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"']}
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: mysql-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
