kind: Secret
metadata:
  name: netco-secrets
  namespace: netco
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: change-me
  MYSQL_ROOT_PASSWORD: change-me
  RESEND_API_KEY: re_replace_me
  SHIPPO_TEST_TOKEN: shippo_test_replace_me
  SHIP_FROM_STREET: 123 Practice St
  SHIP_FROM_CITY: San Francisco
  SHIP_FROM_STATE: CA
  SHIP_FROM_ZIP: "94104"
  SHIP_FROM_PHONE: "4155550100"
